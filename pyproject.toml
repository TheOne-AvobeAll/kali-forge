[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kali-forge"
version = "0.1.0"
description = "A modular, local-first security testing workflow toolkit for authorized assessments and isolated labs."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TheOne-AvobeAll" }]
license = { text = "MIT" }
keywords = ["security", "cli", "automation", "labs"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Topic :: Security",
  "Topic :: System :: Shells",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[project.scripts]
kali-forge = "kali_forge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict = false
